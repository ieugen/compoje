name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - uses: DeLaGuardo/setup-clojure@13.7.0
        with:
          cli: 1.12.6.1673
          bb: 1.13.219

      - uses: actions/cache@v6
        with:
          path: |
            ~/.m2/repository
            ~/.gitlibs
            ~/.deps.clj
            ~/.babashka/pods
          key: deps-${{ hashFiles('deps.edn', 'bb.edn') }}

      - name: Format
        run: bb fmt check

      # clj-kondo (pod) + clojure-lsp diagnostics; fails on findings
      - name: Lint
        run: bb lint

      # unit + integration; integration tests start containers on the runner's Docker.
      # Tests that need a swarm (^:swarm, Docker-in-Docker swarm) don't run on GitHub Actions; run them locally.
      - name: JVM tests
        run: bin/kaocha --skip-meta :swarm

      - name: Babashka tests
        run: bb test-bb

      # docker-cli: the default docker-api engine reads from a swarm even on --dry-run; runners have none
      - name: Dry-run example stacks
        run: |
          for s in nginx ansible-vault file; do
            bb compoje deploy --dry-run --deploy-driver docker-cli "example-stacks/$s/stack.tpl.yml" > /dev/null
          done

      - name: Build and run the jar
        run: |
          bb build-jar
          bb target/compoje.jar --version
