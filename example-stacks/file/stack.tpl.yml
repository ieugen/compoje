x-compoje:
  docker:
    stack: file-example
  providers:
    - name: files
      type: compoje.providers.file/file
  secrets:
    # plain YAML values, used in the template as <{ secrets.common.... }>
    - name: common
      provider: files
      file: shared/common.yml
    # a secret file already on disk (e.g. written by CI), used for a docker secret below
    - name: api-token
      provider: files
      file: secrets/api-token.txt

services:
  app:
    image: docker.io/nginx:stable
    environment:
      REGION: <{ secrets.common.region }>
      LOG_LEVEL: <{ secrets.common.log-level }>
      DB_URL: "postgres://<{ secrets.common.db.host }>:<{ secrets.common.db.port }>/app"
    secrets:
      - source: api_token
        target: api_token
    configs:
      - source: app_conf
        target: /etc/app/app.conf

secrets:
  # created by compoje from the provider result, in memory
  api_token:
    x-compoje:
      from: secrets.api-token

configs:
  # config/app.conf is a template, rendered in memory with the same context
  app_conf:
    x-compoje:
      template: config/app.conf
