x-compoje:
  docker:
    stack: ansible-vault-example
  providers:
    - name: demo-vault
      type: compoje.providers.ansible-vault/ansible-vault
      # demo only: never commit a real vault password
      password-file: vault-password.txt
  secrets:
    # whole file encrypted with `ansible-vault encrypt`
    - name: app
      provider: demo-vault
      file: secrets/app.vault.yml
      # write one decrypted value to a file, used as a docker secret below
      local-path: generated/db_password.txt
      spit-key: db_password
    # plain YAML with inline `!vault` values
    - name: tokens
      provider: demo-vault
      file: secrets/tokens.yml

services:
  app:
    image: docker.io/nginx:stable
    environment:
      DB_USER: <{ app.db_user }>
      API_TOKEN: <{ tokens.api_token }>
      ENVIRONMENT: <{ tokens.environment }>
    secrets:
      - source: db_password
        target: db_password
    configs:
      - source: nginx_cfg
        target: /etc/nginx/conf.d/default.conf

secrets:
  db_password:
    file: generated/db_password.txt
    name: db_password-<% file-hash 'generated/db_password.txt' %>

configs:
  nginx_cfg:
    file: config/nginx.conf
    name: nginx_cfg-<% file-hash 'config/nginx.conf' %>
